services:
  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
    volumes:
      - ./client:/app
      - /app/node_modules
    stdin_open: true
    tty: true
  
      

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/myDatabase
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo
    command: npm start
    

  mongo:
    image: mongo:6.0
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:



