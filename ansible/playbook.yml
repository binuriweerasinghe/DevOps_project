- hosts: localhost
  connection: local
  vars:
    dockerhub_username: "binuriweerasinghe"
    dockerhub_password: "YOUR_DOCKERHUB_PAT"

  tasks:

    - name: Docker login
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"

    - name: Pull server Docker image
      community.docker.docker_image:
        name: binuriweerasinghe/devops_project-server:latest
        source: pull

    - name: Pull client Docker image
      community.docker.docker_image:
        name: binuriweerasinghe/devops_project-client:latest
        source: pull

    - name: Stop old containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - devops_project-server
        - devops_project-client
        - mongo

    - name: Run MongoDB container
      community.docker.docker_container:
        name: mongo
        image: mongo:6.0
        ports:
          - "27018:27017"
        volumes:
          - ~/DevOps_project/mongo-data:/data/db

    - name: Run server container
      community.docker.docker_container:
        name: devops_project-server
        image: binuriweerasinghe/devops_project-server:latest
        ports:
          - "5000:5000"
        env_file: ~/DevOps_project/.env

    - name: Run client container
      community.docker.docker_container:
        name: devops_project-client
        image: binuriweerasinghe/devops_project-client:latest
        ports:
          - "3000:3000"
        env_file: ~/DevOps_project/.env

          


